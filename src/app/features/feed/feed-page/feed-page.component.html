<div class="feed">
  <app-new-post (postCreated)="loadPosts()"></app-new-post>

  <div *ngIf="posts.length === 0" class="empty">
    <span class="material-symbols-rounded">photo_library</span>
    Akışın boş. Yeni biri takip et veya ilk postunu sen paylaş!
  </div>

  <app-post-card
    *ngFor="let post of visiblePosts"
    [post]="post"
    (postDeleted)="onPostDeleted($event)">
  </app-post-card>

  <button
    *ngIf="hasMore"
    class="load-more"
    (click)="loadMore()">
    <span class="material-symbols-rounded">expand_more</span>
    Daha fazla yükle
  </button>

  <button
    *ngIf="atMax"
    class="load-more refresh"
    (click)="refresh()">
    <span class="material-symbols-rounded">refresh</span>
    Sayfayı yenile
  </button>
</div>
