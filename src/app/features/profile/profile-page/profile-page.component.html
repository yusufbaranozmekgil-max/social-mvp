<div class="profile-container" *ngIf="notFound">
  <div class="not-found">Kullanıcı bulunamadı.</div>
</div>

<div class="profile-container" *ngIf="user as u">
  <header class="profile-header">
    <img
      *ngIf="u.profilePhotoUrl; else avatarPlaceholder"
      [src]="u.profilePhotoUrl"
      alt="profile"
      class="avatar" />
    <ng-template #avatarPlaceholder>
      <div class="avatar placeholder">{{ u.username[0].toUpperCase() }}</div>
    </ng-template>

    <div class="info">
      <h2>{{ '@' + u.username }}</h2>
      <p class="bio">{{ u.bio || 'Henüz bio eklenmemiş.' }}</p>

      <div class="stats">
        <span><strong>{{ followingCount }}</strong> takip</span>
        <span><strong>{{ followerCount }}</strong> takipçi</span>
      </div>

      <button
        *ngIf="isOwnProfile && !editing"
        class="edit-btn"
        (click)="startEdit()">
        Profili Düzenle
      </button>

      <button
        *ngIf="!isOwnProfile"
        class="follow-btn"
        [class.following]="isFollowing"
        (click)="toggleFollow()">
        {{ isFollowing ? 'Takipten Çık' : 'Takip Et' }}
      </button>
    </div>
  </header>

  <section class="edit-form" *ngIf="editing">
    <label>
      Bio
      <textarea name="editBio" rows="3" [(ngModel)]="editBio"></textarea>
    </label>

    <label>
      Profil Fotoğrafı URL
      <input type="text" name="editPhotoUrl" [(ngModel)]="editPhotoUrl" />
    </label>

    <div class="edit-actions">
      <button class="cancel" (click)="cancelEdit()">İptal</button>
      <button class="save" (click)="saveEdit()">Kaydet</button>
    </div>
  </section>

  <section class="posts">
    <h3>Paylaşımlar</h3>
    <div *ngIf="posts.length === 0" class="empty">
      Henüz post paylaşılmamış.
    </div>
    <app-post-card *ngFor="let post of posts" [post]="post"></app-post-card>
  </section>
</div>
